<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEDOL Forge</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --gold: #c9a227;
        --gold-dim: #8a6f1a;
        --text: #e8e6e3;
        --muted: #6b6b6b;
        --danger: #a33;
        --radius: 0px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Georgia", "Times New Roman", serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background-image: radial-gradient(
          ellipse at 50% 0%,
          rgba(201, 162, 39, 0.06) 0%,
          transparent 60%
        );
      }
      .container {
        width: 100%;
        max-width: 680px;
      }
      header {
        margin-bottom: 3rem;
        text-align: left;
        border-left: 3px solid var(--gold);
        padding-left: 1.5rem;
      }
      header h1 {
        font-size: clamp(2.2rem, 6vw, 3.8rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      header h1 em {
        color: var(--gold);
        font-style: italic;
      }
      header p {
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-top: 0.6rem;
        font-family: "Courier New", monospace;
      }
      .input-group {
        display: flex;
        gap: 0;
        margin-bottom: 2rem;
        border: 1px solid #2a2a2a;
        transition: border-color 0.4s;
      }
      .input-group:focus-within {
        border-color: var(--gold);
      }
      #sedol-input {
        flex: 1;
        background: var(--surface);
        border: none;
        padding: 1.2rem 1.4rem;
        font-family: "Courier New", monospace;
        font-size: 1.4rem;
        letter-spacing: 0.3em;
        color: var(--text);
        text-transform: uppercase;
        outline: none;
      }
      #sedol-input::placeholder {
        color: #333;
        letter-spacing: 0.1em;
        font-size: 1rem;
      }
      #validate-btn {
        background: var(--gold);
        color: #0a0a0a;
        border: none;
        padding: 0 2rem;
        font-family: "Courier New", monospace;
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.3s;
      }
      #validate-btn:hover {
        background: #e0b830;
      }
      #result {
        min-height: 120px;
        padding: 1.8rem;
        background: var(--surface);
        border: 1px solid #1f1f1f;
        font-family: "Courier New", monospace;
        font-size: 0.9rem;
        line-height: 1.8;
        white-space: pre-wrap;
        word-break: break-all;
        transition: border-color 0.3s;
      }
      #result.valid {
        border-color: var(--gold);
      }
      #result.invalid {
        border-color: var(--danger);
      }
      #result .label {
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      #result .value {
        color: var(--text);
        font-size: 1.3rem;
        letter-spacing: 0.1em;
      }
      #result .value.gold {
        color: var(--gold);
      }
      #result .value.red {
        color: var(--danger);
      }
      .examples {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }
      .examples button {
        background: transparent;
        border: 1px solid #2a2a2a;
        color: var(--muted);
        padding: 0.5rem 1rem;
        font-family: "Courier New", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: all 0.25s;
      }
      .examples button:hover {
        border-color: var(--gold);
        color: var(--gold);
      }
      footer {
        margin-top: 4rem;
        color: #333;
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-family: "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          SEDOL
          <em>Forge</em>
        </h1>
        <p>Check digit calculator / validator</p>
      </header>

      <div class="input-group">
        <input
          id="sedol-input"
          type="text"
          maxlength="7"
          placeholder="ENTER 6-CHAR CODE"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="validate-btn">Execute</button>
      </div>

      <div id="result">
        <span class="label">Awaiting input</span>
      </div>

      <div class="examples">
        <button data-code="710889">710889</button>
        <button data-code="B0YBKJ">B0YBKJ</button>
        <button data-code="B00030">B00030</button>
        <button data-code="BOATER">BOATER (invalid)</button>
        <button data-code="228276">228276</button>
      </div>

      <footer>SEDOL algorithm: weights [1,3,1,7,3,9] / mod-10 checksum</footer>
    </div>

    <script>
      (function () {
        "use strict";

        var WEIGHTS = [1, 3, 1, 7, 3, 9];
        var VALID_RE = /^[0-9BCDFGHJKLMNPQRSTVWXYZ]{6}$/;

        function charValue(ch) {
          if (ch >= "0" && ch <= "9") return ch.charCodeAt(0) - 48;
          return ch.charCodeAt(0) - 55;
        }

        function computeCheckDigit(code) {
          if (!VALID_RE.test(code)) return null;
          var sum = 0;
          for (var i = 0; i < 6; i++) {
            sum += charValue(code[i]) * WEIGHTS[i];
          }
          return (10 - (sum % 10)) % 10;
        }

        function render(message, cls) {
          var el = document.getElementById("result");
          el.className = cls || "";
          el.innerHTML = message;
        }

        function handleValidate() {
          var raw = document
            .getElementById("sedol-input")
            .value.trim()
            .toUpperCase();
          if (raw.length === 0) {
            render('<span class="label">Empty input</span>');
            return;
          }
          if (raw.length > 6) {
            render(
              '<span class="label">Too long</span><br><span class="value red">Expected 6 characters, received ' +
                raw.length +
                "</span>",
              "invalid"
            );
            return;
          }
          if (!VALID_RE.test(raw)) {
            render(
              '<span class="label">Rejected</span><br><span class="value red">Invalid characters. Use digits 0-9 and consonants only.</span>',
              "invalid"
            );
            return;
          }
          var digit = computeCheckDigit(raw);
          if (digit === null) {
            render(
              '<span class="label">Rejected</span><br><span class="value red">Validation failure</span>',
              "invalid"
            );
            return;
          }
          render(
            '<span class="label">Original</span><br><span class="value">' +
              raw +
              "</span><br><br>" +
              '<span class="label">Complete SEDOL</span><br><span class="value gold">' +
              raw +
              digit +
              "</span>",
            "valid"
          );
        }

        document
          .getElementById("validate-btn")
          .addEventListener("click", handleValidate);
        document
          .getElementById("sedol-input")
          .addEventListener("keydown", function (e) {
            if (e.key === "Enter") handleValidate();
          });

        var btns = document.querySelectorAll(".examples button");
        for (var i = 0; i < btns.length; i++) {
          btns[i].addEventListener("click", function () {
            var code = this.getAttribute("data-code");
            if (code.indexOf(" ") !== -1) code = code.split(" ")[0];
            document.getElementById("sedol-input").value = code;
            handleValidate();
          });
        }
      })();
    </script>
  </body>
</html>
